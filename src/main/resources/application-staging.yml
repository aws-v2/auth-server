server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

frontend:
  url: ${STAGING_FRONTEND_URL:http://frontend:5173}

jwt:
  secret: ${STAGING_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_SECRET_EXPIRATION:86400000}

nats:
  url: nats://${STAGING_NATS_URL:nats-staging:4222}
  username: ${STAGING_NATS_USERNAME:nats-staging-user}
  password: ${STAGING_NATS_PASSWORD:nats-staging-password}
  prefix: ${STAGING_NATS_PREFIX:staging.v1}
system-user:
  email: ${STAGING_SYSTEM_USER_EMAIL:system@internal.local}
  password: ${STAGING_SYSTEM_USER_PASSWORD:change-me}
  id: ${STAGING_SYSTEM_USER_ID:00000000-0000-0000-0000-000000000000}

app:
  email-verification-enabled: ${STAGING_EMAIL_VERIFICATION_ENABLED:false}
spring:
  application:
    name: auth-service
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: "false"
    show-sql: "false"
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  datasource:
    password: ${STAGING_DATASOURCE_PASSWORD:postgres-staging-password}
    driver-class-name: org.postgresql.Driver
    username: ${STAGING_DATASOURCE_USERNAME:postgres-staging-user}
    url: ${STAGING_DATASOURCE_URL:jdbc:postgresql://postgres-staging:5432/auth_db2}
    # url: ${PROD_DATASOURCE_URL:jdbc:postgresql://ep-purple-feather-aypga34j-pooler.c-5.us-east-2.aws.neon.tech/auth_db?sslmode=require&channel_binding=require}

    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
