  mail:
    host: ${STAGING_MAIL_HOST:smtp.gmail.com}
    port: ${STAGING_MAIL_PORT:587}
    username: ${STAGING_MAIL_USERNAME:emqarani@gmail.com}
    password: ${STAGING_MAIL_PASSWORD}

  datasource:
    password: ${STAGING_DATASOURCE_PASSWORD:postgres-staging-password}
    driver-class-name: org.postgresql.Driver
    username: ${STAGING_DATASOURCE_USERNAME:postgres-staging-user}
    url: ${STAGING_DATASOURCE_URL:jdbc:postgresql://postgres-staging:5432/auth_db2}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
